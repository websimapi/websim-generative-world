<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generative World</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
</head>
<body>
    <div id="app-container">
        <div id="game-area">
            <svg id="game-canvas" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet"></svg>
            <div id="loading-overlay" class="hidden">
                <div class="spinner"></div>
                <p>Generating...</p>
            </div>
        </div>
        <div id="controls-panel">
            <div id="input-area">
                <textarea id="command-input" placeholder="Describe what to create or ask about the world..."></textarea>
                <button id="submit-command">Execute</button>
            </div>
            <div id="message-log">
                <p>Welcome to the Generative World! Type a command to begin.</p>
            </div>
            <div id="players-list-container">
                <h3>Players Online:</h3>
                <div id="players-list"></div>
            </div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.12.5/index.js"
        }
    }
    </script>
    <script type="module" src="script.js"></script>

</body>
</html>
